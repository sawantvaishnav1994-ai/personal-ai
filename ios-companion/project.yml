name: PersonalAICompanion
options:
  bundleIdPrefix: ai.personal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  PersonalAICompanion:
    type: application
    platform: iOS
    sources: [PersonalAICompanion]
    info:
      path: PersonalAICompanion/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.personal.companion.ios
        CODE_SIGN_ENTITLEMENTS: PersonalAICompanion/PersonalAICompanion.entitlements
  PersonalAICompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PersonalAICompanionTests]
    dependencies:
      - target: PersonalAICompanion
