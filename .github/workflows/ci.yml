name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m compileall -q app agent automation browser capabilities core dashboard desktop devices future_intelligence integrations knowledge memory models proactive qualification security server tools ui updates vision voice
      - name: Run tests with diagnostic capture
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 1
